<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KANNA - Silver Gold Cosmic v2</title>
    <style>
        :root {
            --cell-size: 80px;
            --gap: 10px;
            --cell-total: 90px;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; touch-action: none; }

        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .grid-wrapper {
            position: relative;
            width: calc(var(--cell-total) * 10);
            height: calc(var(--cell-total) * 5);
            overflow: hidden;
        }

        .grid-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .square {
            width: var(--cell-size); height: var(--cell-size);
            background-color: #000;
            border: 1px solid rgba(220, 220, 230, 0.35);
            border-radius: var(--radius);
            position: absolute;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .square:hover { border-color: rgba(220, 220, 230, 0.5); }
        .square svg { width: 100%; height: 100%; pointer-events: none; }

        /* ========== EMPTY (case vidée par tap court) ========== */
        .square.empty {
            border-color: transparent !important;
            background-color: transparent !important;
            cursor: grab;
            box-shadow: none !important;
        }
        .square.empty svg { display: none; }

        /* Animation de disparition (scale 1 -> 0) */
        .square.vanishing {
            transition: transform 0.45s cubic-bezier(0.55, 0, 0.7, 0.2), opacity 0.45s ease-out !important;
            transform: scale(0) !important;
            opacity: 0 !important;
            pointer-events: none;
        }

        svg .separator { stroke: rgba(180, 180, 190, 0.3); stroke-width: 1; }
        svg line.icon, svg path.icon, svg circle.icon, svg rect.icon, svg polyline.icon {
            stroke: rgba(180, 180, 190, 0.35); stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round; fill: none;
        }
        svg circle.point { fill: rgba(180, 180, 190, 0.35); stroke: none; }

        /* ========== SILVER ========== */
        .square.silver {
            background-color: #12131a;
            border-color: rgba(126, 200, 227, 0.7);
            box-shadow: 0 0 15px rgba(126, 200, 227, 0.25), inset 0 0 20px rgba(126, 200, 227, 0.05);
        }
        .square.silver svg line.icon, .square.silver svg path.icon,
        .square.silver svg circle.icon, .square.silver svg rect.icon {
            stroke: #7ec8e3; filter: drop-shadow(0 0 3px rgba(126, 200, 227, 0.5));
        }
        .square.silver svg circle.point { fill: #7ec8e3; filter: drop-shadow(0 0 3px rgba(126, 200, 227, 0.5)); }
        .square.silver svg .separator { stroke: rgba(126, 200, 227, 0.4); }

        /* ========== GOLD ========== */
        .square.gold {
            background-color: #12131a;
            border-color: rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .square.gold svg line.icon, .square.gold svg path.icon,
        .square.gold svg circle.icon, .square.gold svg rect.icon {
            stroke: #ffd700; filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        .square.gold svg circle.point { fill: #ffd700; filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6)); }
        .square.gold svg .separator { stroke: rgba(255, 215, 0, 0.4); }

        /* ========== COSMIC ========== */
        @property --cosmic-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

        .square.cosmic {
            border: 2px solid transparent;
            background:
                linear-gradient(#12131a, #12131a) padding-box,
                conic-gradient(from var(--cosmic-angle, 0deg), #ff006e, #8338ec, #06b6d4, #34d399, #ffd700, #ff006e) border-box;
            box-shadow:
                0 0 40px rgba(131, 56, 236, 0.6),
                0 0 60px rgba(255, 0, 110, 0.3),
                0 0 80px rgba(6, 182, 212, 0.3),
                inset 0 0 40px rgba(131, 56, 236, 0.15);
            animation: cosmicRotate 4s linear infinite, cosmicPulse 2s ease-in-out infinite;
        }
        .square.cosmic svg line.icon, .square.cosmic svg path.icon,
        .square.cosmic svg circle.icon, .square.cosmic svg rect.icon {
            stroke: #c4b5fd;
            filter: drop-shadow(0 0 8px rgba(131, 56, 236, 0.9)) drop-shadow(0 0 12px rgba(255, 0, 110, 0.6));
            animation: cosmicIconShift 3s ease-in-out infinite;
        }
        .square.cosmic svg circle.point {
            fill: #c4b5fd;
            filter: drop-shadow(0 0 8px rgba(131, 56, 236, 0.9));
            animation: cosmicPointPulse 1.5s ease-in-out infinite;
        }
        .square.cosmic svg .separator { stroke: rgba(196, 181, 253, 0.7); }

        @keyframes cosmicRotate { to { --cosmic-angle: 360deg; } }
        @keyframes cosmicPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(131, 56, 236, 0.6), 0 0 60px rgba(255, 0, 110, 0.3), 0 0 80px rgba(6, 182, 212, 0.3), inset 0 0 40px rgba(131, 56, 236, 0.15); }
            50% { box-shadow: 0 0 55px rgba(131, 56, 236, 0.8), 0 0 80px rgba(255, 0, 110, 0.5), 0 0 100px rgba(6, 182, 212, 0.4), inset 0 0 50px rgba(131, 56, 236, 0.2); }
        }
        @keyframes cosmicIconShift { 0%, 100% { stroke: #c4b5fd; } 33% { stroke: #22d3ee; } 66% { stroke: #f472b6; } }
        @keyframes cosmicPointPulse { 0%, 100% { fill: #c4b5fd; } 50% { fill: #f472b6; } }

        /* ========== INFO ========== */
        .move-counter {
            color: rgba(180, 180, 190, 0.5);
            font-size: 11px;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .move-counter .silver-label { color: #7ec8e3; }
        .move-counter .gold-label { color: #ffd700; }
        .move-counter .cosmic-label { color: #c4b5fd; }
    </style>
</head>
<body>

    <div class="move-counter">
        <span>MOVES: <span id="moveCount">0</span></span>
        <span class="silver-label">● 7 Silver</span>
        <span class="gold-label">● 6 Gold</span>
        <span class="cosmic-label">● 5 Cosmic</span>
    </div>

    <div class="grid-wrapper">
        <div class="grid-container" id="gridContainer"></div>

    <script>
        // ========== RESPONSIVE ==========
        function computeSizes() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const pad = 16;
            const headerH = 30; // espace pour le compteur

            const availW = vw - pad;
            const availH = vh - pad - headerH;

            // 10 cellules + 10 gaps en largeur, 5 cellules + 5 gaps en hauteur
            const cellFromW = Math.floor((availW) / 10.5);
            const cellFromH = Math.floor((availH) / 5.5);
            const cellSize = Math.min(cellFromW, cellFromH, 80); // max 80 comme avant
            const gap = Math.max(2, Math.round(cellSize * 0.08));
            const radius = Math.max(4, Math.round(cellSize * 0.15));

            document.documentElement.style.setProperty('--cell-size', cellSize + 'px');
            document.documentElement.style.setProperty('--gap', gap + 'px');
            document.documentElement.style.setProperty('--cell-total', (cellSize + gap) + 'px');
            document.documentElement.style.setProperty('--radius', radius + 'px');

            return { cellSize, gap, cellTotal: cellSize + gap };
        }
        let sizes = computeSizes();

        const COLS = 10;
        const ROWS = 5;
        // Getters dynamiques
        function getCellTotal() { return sizes.cellTotal; }

            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><path class="icon" d="M 20 32 L 40 12 L 60 32 Z"/><line class="icon" x1="25" y1="55" x2="55" y2="55"/><line class="icon" x1="30" y1="65" x2="50" y2="65"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><circle class="point" cx="22" cy="40" r="5"/><line class="icon" x1="12" y1="40" x2="8" y2="40"/><line class="icon" x1="22" y1="30" x2="22" y2="22"/><line class="icon" x1="32" y1="40" x2="36" y2="40"/><line class="icon" x1="22" y1="50" x2="22" y2="58"/><path class="icon" d="M 52 25 Q 68 40 52 55"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><line class="icon" x1="15" y1="20" x2="25" y2="20"/><line class="icon" x1="35" y1="20" x2="45" y2="20"/><line class="icon" x1="55" y1="20" x2="65" y2="20"/><path class="icon" d="M 20 50 Q 40 70 60 50"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><circle class="icon" cx="22" cy="40" r="12"/><circle class="point" cx="22" cy="40" r="3"/><line class="icon" x1="48" y1="25" x2="48" y2="55"/><line class="icon" x1="58" y1="25" x2="58" y2="55"/><line class="icon" x1="68" y1="25" x2="68" y2="55"/></svg>`
        ];

        // ========== FAMILLES ==========
        // Tirer aléatoirement 7 silver, 6 gold, 5 cosmic (sans doublon)
        const allIndices = Array.from({length: 50}, (_, i) => i);
        for (let i = allIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
        }

        const families = {}; // tileIndex -> 'silver' | 'gold' | 'cosmic'
        const silverSet = new Set(allIndices.slice(0, 7));
        const goldSet = new Set(allIndices.slice(7, 13));
        const cosmicSet = new Set(allIndices.slice(13, 18));

        silverSet.forEach(i => families[i] = 'silver');
        goldSet.forEach(i => families[i] = 'gold');
        cosmicSet.forEach(i => families[i] = 'cosmic');

        // ========== GRILLE ==========
        let grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = r * COLS + c;
            }
        }

        const container = document.getElementById('gridContainer');
        let tileElements = [];

        for (let i = 0; i < 50; i++) {
            const tile = document.createElement('div');
            tile.className = 'square';
            if (families[i]) tile.classList.add(families[i]);
            tile.innerHTML = '';
            tile.dataset.index = i;
            container.appendChild(tile);
            tileElements.push(tile);
        }

        function updateAllPositions() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const ti = grid[r][c];
                    const tile = tileElements[ti];
                    tile.style.transition = 'none';
                    tile.style.left = (c * getCellTotal()) + 'px';
                    tile.style.top = (r * getCellTotal()) + 'px';
                }
            }
        }
        updateAllPositions();

        // ========== DRAG ==========
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let dragAxis = null;
        let dragFamily = null;
        let moveCount = 0;
        let isAnimating = false;

        // ========== COLUMN DRAG (case noire) ==========
        let isColumnDragging = false;
        let columnDragIndex = -1;      // index de la colonne d'origine sélectionnée
        let columnDragStartX = 0;       // position initiale du curseur
        let columnDragOffset = 0;       // décalage actuel en px
        let columnLiveShift = 0;        // nb de cases dépassées (entier signé)

        // ========== TAP / HOLD (case noire) ==========
        // Tap court (< TAP_MAX_MS sans bouger) => disparition
        // Hold (>= TAP_MAX_MS) ou bougé => column drag
        const TAP_MAX_MS = 200;
        const TAP_MOVE_THRESHOLD = 8; // px
        let pendingTapTimer = null;
        let pendingTapTileIndex = -1;
        let pendingTapStartX = 0;
        let pendingTapStartY = 0;
        let pendingTapClientX = 0; // pour pouvoir activer le column drag avec la bonne origine
        let isPendingTap = false;  // true entre mousedown et la décision tap/drag

        function findPos(tileIndex) {
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++)
                    if (grid[r][c] === tileIndex) return { r, c };
            return null;
        }

        function getFamilySet(family) {
            if (family === 'silver') return silverSet;
            if (family === 'gold') return goldSet;
            if (family === 'cosmic') return cosmicSet;
            return null;
        }

        // ========== EMPTY (cases vidées) ==========
        const emptySet = new Set();

        function vanishTile(tileIndex) {
            if (emptySet.has(tileIndex)) return;
            const tile = tileElements[tileIndex];

            // Marquer immédiatement comme vide dans l'ensemble logique
            // (pour empêcher les drags de colonne pendant l'animation)
            emptySet.add(tileIndex);

            // Étape 1 : poser explicitement l'état initial (scale 1, opacité 1)
            //           sans transition, pour que le navigateur l'enregistre
            tile.style.transition = 'none';
            tile.style.transformOrigin = 'center center';
            tile.style.transform = 'scale(1)';
            tile.style.opacity = '1';

            // Étape 2 : double rAF pour forcer le navigateur à valider l'état initial
            //           AVANT d'appliquer la transition vers scale(0)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    tile.style.transition = 'transform 0.45s cubic-bezier(0.55, 0, 0.7, 0.2), opacity 0.45s ease-out';
                    tile.style.transform = 'scale(0)';
                    tile.style.opacity = '0';
                });
            });

            // Étape 3 : à la fin de l'animation, on bascule en classe .empty
            setTimeout(() => {
                tile.classList.add('empty');
                tile.style.transition = 'none';
                tile.style.transform = '';
                tile.style.opacity = '';
            }, 500);
        }

        function restoreTile(tileIndex) {
            if (!emptySet.has(tileIndex)) return;
            const tile = tileElements[tileIndex];

            // Retirer l'état vide
            emptySet.delete(tileIndex);
            tile.classList.remove('empty');

            // État initial : invisible, échelle 0
            tile.style.transition = 'none';
            tile.style.transformOrigin = 'center center';
            tile.style.transform = 'scale(0)';
            tile.style.opacity = '0';

            // Double rAF puis animation vers scale(1)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    tile.style.transition = 'transform 0.40s cubic-bezier(0.2, 0.7, 0.3, 1.2), opacity 0.40s ease-out';
                    tile.style.transform = 'scale(1)';
                    tile.style.opacity = '1';
                });
            });

            // Cleanup à la fin
            setTimeout(() => {
                tile.style.transition = 'none';
                tile.style.transform = '';
                tile.style.opacity = '';
            }, 450);
        }

        // ========== TAP / HOLD helpers ==========
        function clearPendingTap() {
            if (pendingTapTimer !== null) {
                clearTimeout(pendingTapTimer);
                pendingTapTimer = null;
            }
            isPendingTap = false;
            pendingTapTileIndex = -1;
        }

        // Bascule en column drag (appelé sur hold ou sur mouvement)
        function activateColumnDrag() {
            if (!isPendingTap) return;
            const ti = pendingTapTileIndex;
            const pos = findPos(ti);
            if (!pos) { clearPendingTap(); return; }

            isColumnDragging = true;
            columnDragIndex = pos.c;
            columnDragStartX = pendingTapClientX;
            columnDragOffset = 0;
            columnLiveShift = 0;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const t = tileElements[grid[r][c]];
                    t.style.transition = 'none';
                    if (c === columnDragIndex) {
                        t.style.zIndex = '10';
                    }
                }
            }

            isPendingTap = false;
            pendingTapTimer = null;
            pendingTapTileIndex = -1;
        }

        function startDrag(e) {
            if (isAnimating) return;
            const tile = e.target.closest('.square');
            if (!tile) return;

            const ti = parseInt(tile.dataset.index);
            const family = families[ti];

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Case noire (pleine ou vide) => en attente : tap court ou hold
            if (!family) {
                e.preventDefault();
                const pos = findPos(ti);
                if (!pos) return;

                isPendingTap = true;
                pendingTapTileIndex = ti;
                pendingTapStartX = clientX;
                pendingTapStartY = clientY;
                pendingTapClientX = clientX;

                clearTimeout(pendingTapTimer);
                pendingTapTimer = setTimeout(() => {
                    // L'utilisateur maintient => bascule en column drag
                    activateColumnDrag();
                }, TAP_MAX_MS);
                return;
            }

            // Case colorée => comportement famille existant
            e.preventDefault();
            isDragging = true;
            dragAxis = null;
            dragFamily = family;
            dragStartX = clientX;
            dragStartY = clientY;
        }

        function moveDrag(e) {
            // Pending tap : si on bouge, on bascule en column drag immédiatement
            if (isPendingTap) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - pendingTapStartX;
                const dy = clientY - pendingTapStartY;
                if (Math.abs(dx) > TAP_MOVE_THRESHOLD || Math.abs(dy) > TAP_MOVE_THRESHOLD) {
                    e.preventDefault();
                    clearTimeout(pendingTapTimer);
                    pendingTapTimer = null;
                    activateColumnDrag();
                    // Maintenant qu'on est en column drag, on traite ce mouvement
                    columnDragOffset = clientX - columnDragStartX;
                    renderColumnDrag();
                    return;
                }
                return; // pas encore décidé
            }

            // Column drag : suivi pixel-perfect
            if (isColumnDragging) {
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                columnDragOffset = clientX - columnDragStartX;
                renderColumnDrag();
                return;
            }

            if (!isDragging || dragAxis !== null) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;

            const threshold = 20;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    dragAxis = dx > 0 ? 'right' : 'left';
                } else {
                    dragAxis = dy > 0 ? 'down' : 'up';
                }
                executeGroupMove(dragFamily, dragAxis);
            }
        }

        function endDrag() {
            // Pending tap relâché avant la fin du timer => c'est un tap court
            // => disparition si pleine, restauration si vide
            if (isPendingTap) {
                const ti = pendingTapTileIndex;
                clearPendingTap();
                if (ti >= 0) {
                    if (emptySet.has(ti)) {
                        restoreTile(ti);
                    } else {
                        vanishTile(ti);
                    }
                }
                return;
            }
            if (isColumnDragging) {
                finishColumnDrag();
                return;
            }
            isDragging = false;
            dragAxis = null;
            dragFamily = null;
        }

        // ========== COLUMN DRAG : rendu fluide + snap ==========
        function renderColumnDrag() {
            const cellTotal = getCellTotal();
            const fromCol = columnDragIndex;

            // Limites : on borne le drag pour qu'il reste dans la grille (pas de wrap)
            const minOffset = -fromCol * cellTotal;                // colonne 0 max à gauche
            const maxOffset = (COLS - 1 - fromCol) * cellTotal;    // colonne COLS-1 max à droite
            if (columnDragOffset < minOffset) columnDragOffset = minOffset;
            if (columnDragOffset > maxOffset) columnDragOffset = maxOffset;

            // Calcul du nb de cases dépassées : on bascule à la moitié d'une case
            const newShift = Math.round(columnDragOffset / cellTotal);

            // 1) La colonne draguée suit le doigt en pixel-perfect
            for (let r = 0; r < ROWS; r++) {
                const tile = tileElements[grid[r][fromCol]];
                tile.style.transition = 'none';
                tile.style.left = (fromCol * cellTotal + columnDragOffset) + 'px';
            }

            // 2) Si le shift live a changé, on anime les colonnes concernées vers leurs nouvelles positions
            if (newShift !== columnLiveShift) {
                // Pour chaque colonne d'origine c (≠ fromCol), sa position visuelle dépend du shift courant :
                //   - si c est entre fromCol+1 et fromCol+newShift (newShift>0) : elle se décale de -1 (vers fromCol)
                //   - si c est entre fromCol+newShift et fromCol-1 (newShift<0) : elle se décale de +1
                //   - sinon : elle reste à sa position d'origine c
                // On recalcule la position visuelle de TOUTES les colonnes non-draguées et on anime.
                for (let c = 0; c < COLS; c++) {
                    if (c === fromCol) continue;
                    const visualC = computeVisualCol(c, fromCol, newShift);
                    for (let r = 0; r < ROWS; r++) {
                        const tile = tileElements[grid[r][c]];
                        tile.style.transition = 'left 0.18s ease-out';
                        tile.style.left = (visualC * cellTotal) + 'px';
                    }
                }
                columnLiveShift = newShift;
            }
        }

        // Calcule où la colonne d'origine `c` doit visuellement se trouver
        // quand la colonne draguée `fromCol` a un shift de `shift` cases.
        function computeVisualCol(c, fromCol, shift) {
            if (shift > 0) {
                // Draguée va vers la droite : colonnes entre fromCol+1 et fromCol+shift se décalent de -1
                if (c > fromCol && c <= fromCol + shift) return c - 1;
                return c;
            } else if (shift < 0) {
                // Draguée va vers la gauche : colonnes entre fromCol+shift et fromCol-1 se décalent de +1
                if (c >= fromCol + shift && c < fromCol) return c + 1;
                return c;
            }
            return c;
        }

        function finishColumnDrag() {
            const cellTotal = getCellTotal();
            const fromCol = columnDragIndex;
            const shift = columnLiveShift;
            const toCol = fromCol + shift;

            isAnimating = true;

            // Snap : la colonne draguée glisse vers sa position cible (toCol)
            for (let r = 0; r < ROWS; r++) {
                const tile = tileElements[grid[r][fromCol]];
                tile.style.transition = 'left 0.15s ease-out';
                tile.style.left = (toCol * cellTotal) + 'px';
            }

            // Les autres colonnes sont déjà à leur position visuelle correcte (animées en live).
            // On les laisse, juste on s'assure qu'elles ont une transition propre.

            // Mise à jour de la grille logique
            if (shift !== 0) {
                const newGrid = grid.map(row => [...row]);
                // Sauvegarder la colonne draguée
                const draggedCol = [];
                for (let r = 0; r < ROWS; r++) draggedCol.push(grid[r][fromCol]);

                // Décaler les colonnes intermédiaires
                if (shift > 0) {
                    // colonnes fromCol+1 .. fromCol+shift reculent de 1 vers la gauche
                    for (let c = fromCol + 1; c <= fromCol + shift; c++) {
                        for (let r = 0; r < ROWS; r++) {
                            newGrid[r][c - 1] = grid[r][c];
                        }
                    }
                } else {
                    // colonnes fromCol+shift .. fromCol-1 avancent de 1 vers la droite
                    for (let c = fromCol - 1; c >= fromCol + shift; c--) {
                        for (let r = 0; r < ROWS; r++) {
                            newGrid[r][c + 1] = grid[r][c];
                        }
                    }
                }
                // Placer la colonne draguée à sa cible
                for (let r = 0; r < ROWS; r++) {
                    newGrid[r][toCol] = draggedCol[r];
                }
                grid = newGrid;
            }

            // Cleanup
            setTimeout(() => {
                for (let i = 0; i < tileElements.length; i++) {
                    tileElements[i].style.zIndex = '';
                }
                updateAllPositions();
                isColumnDragging = false;
                columnDragIndex = -1;
                columnDragOffset = 0;
                columnLiveShift = 0;
                isAnimating = false;
                if (shift !== 0) {
                    moveCount++;
                    document.getElementById('moveCount').textContent = moveCount;
                }
            }, 180);
        }

        function executeGroupMove(family, direction) {
            isAnimating = true;

            const deltas = {
                'up':    { dr: -1, dc: 0 },
                'down':  { dr: 1,  dc: 0 },
                'left':  { dr: 0,  dc: -1 },
                'right': { dr: 0,  dc: 1 }
            };
            const { dr, dc } = deltas[direction];
            const familySet = getFamilySet(family);

            // Snapshot de la grille actuelle
            const oldGrid = grid.map(row => [...row]);

            // Positions actuelles des membres
            // Chaque membre avance d'une case dans la direction, MAIS si la case
            // d'arrivée est vide (emptySet), il continue jusqu'à atterrir sur une
            // case non-vide. Sécurité : on borne à ROWS*COLS itérations pour éviter
            // une boucle infinie si toute la ligne/colonne était vide.
            const maxSteps = ROWS * COLS;
            const targets = [];
            for (const ti of familySet) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (oldGrid[r][c] === ti) {
                            let toR = ((r + dr) % ROWS + ROWS) % ROWS;
                            let toC = ((c + dc) % COLS + COLS) % COLS;
                            let steps = 1;
                            // Tant que la case cible est vide, on avance encore
                            while (emptySet.has(oldGrid[toR][toC]) && steps < maxSteps) {
                                toR = ((toR + dr) % ROWS + ROWS) % ROWS;
                                toC = ((toC + dc) % COLS + COLS) % COLS;
                                steps++;
                                // Si on revient à la case de départ, stop
                                if (toR === r && toC === c) break;
                            }
                            targets.push({
                                tileIndex: ti,
                                fromR: r, fromC: c,
                                toR: toR,
                                toC: toC
                            });
                        }
                    }
                }
            }

            // Set des cases cibles de la famille
            const targetKeys = new Set(targets.map(t => t.toR + ',' + t.toC));

            // Non-famille qui se trouvent sur une case cible : ils doivent bouger
            // Chaque non-famille va à la source DU MEMBRE QUI ARRIVE sur sa case
            // Les cases vides ne déclenchent pas de swap (elles restent en place)
            const swaps = [];
            for (const t of targets) {
                const occupant = oldGrid[t.toR][t.toC];
                if (!familySet.has(occupant) && !emptySet.has(occupant)) {
                    // Ce non-famille est poussé par ce membre précis
                    // Il va à la source de CE membre
                    swaps.push({ normalTile: occupant, toR: t.fromR, toC: t.fromC });
                }
            }

            // Mais attention : si la source de ce membre est AUSSI une case cible
            // d'un autre membre, alors il y a conflit.
            // Dans ce cas, il faut chaîner : le non-famille va à la source du membre
            // dont la cible est cette source, etc.
            // 
            // Simplifions : on sait que le nombre de cases libérées (sources non-cibles)
            // = le nombre de non-famille déplacés.
            // On construit la chaîne : pour chaque non-famille, on suit la chaîne
            // de sources jusqu'à trouver une source qui n'est pas une cible.

            // Map : cible -> source pour les membres
            const targetToSource = {};
            for (const t of targets) {
                targetToSource[t.toR + ',' + t.toC] = { r: t.fromR, c: t.fromC };
            }

            // Pour chaque swap, suivre la chaîne
            for (const s of swaps) {
                let destR = s.toR;
                let destC = s.toC;
                let key = destR + ',' + destC;
                // Tant que la destination est aussi une case cible d'un membre,
                // on suit vers la source de ce membre
                while (targetKeys.has(key)) {
                    const src = targetToSource[key];
                    destR = src.r;
                    destC = src.c;
                    key = destR + ',' + destC;
                }
                s.toR = destR;
                s.toC = destC;
            }

            // Construire la nouvelle grille
            const newGrid = oldGrid.map(row => [...row]);

            // Effacer toutes les positions sources des membres
            for (const t of targets) {
                newGrid[t.fromR][t.fromC] = -99;
            }

            // Placer les membres à leurs cibles
            for (const t of targets) {
                newGrid[t.toR][t.toC] = t.tileIndex;
            }

            // Placer les non-famille à leurs destinations chaînées
            for (const s of swaps) {
                newGrid[s.toR][s.toC] = s.normalTile;
            }

            // Vérification
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (newGrid[r][c] === -99 || newGrid[r][c] < 0) {
                        console.error('BUG: case non remplie à', r, c);
                        isAnimating = false;
                        return;
                    }
                }
            }

            grid = newGrid;
            animateMove(targets, swaps, dr, dc);

            moveCount++;
            document.getElementById('moveCount').textContent = moveCount;
        }

        function animateMove(targets, swaps, dr, dc) {
            const pxX = dc * getCellTotal();
            const pxY = dr * getCellTotal();

            for (const t of targets) {
                const tile = tileElements[t.tileIndex];
                // Élever le membre en mouvement pour qu'il "passe devant"
                tile.style.zIndex = '5';
                const targetLeft = t.toC * getCellTotal();
                const targetTop = t.toR * getCellTotal();

                // Vrai wrap = le déplacement signé (toC - fromC) est de signe opposé à dc
                // (idem pour les lignes). Sinon c'est un saut linéaire (passe sur des vides).
                const deltaC = t.toC - t.fromC;
                const deltaR = t.toR - t.fromR;
                const isWrap = (dc !== 0 && Math.sign(deltaC) !== 0 && Math.sign(deltaC) !== Math.sign(dc))
                            || (dr !== 0 && Math.sign(deltaR) !== 0 && Math.sign(deltaR) !== Math.sign(dr));

                if (isWrap) {
                    const exitLeft = t.fromC * getCellTotal() + pxX;
                    const exitTop = t.fromR * getCellTotal() + pxY;
                    tile.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
                    tile.style.left = exitLeft + 'px';
                    tile.style.top = exitTop + 'px';
                    setTimeout(() => {
                        tile.style.transition = 'none';
                        tile.style.left = targetLeft + 'px';
                        tile.style.top = targetTop + 'px';
                    }, 160);
                } else {
                    // Saut linéaire (1 ou plusieurs cases) : animer en ligne droite
                    // Durée légèrement augmentée pour les longs sauts
                    const distance = Math.max(Math.abs(deltaC), Math.abs(deltaR));
                    const duration = Math.min(0.30, 0.15 + (distance - 1) * 0.05);
                    tile.style.transition = `left ${duration}s ease-out, top ${duration}s ease-out`;
                    tile.style.left = targetLeft + 'px';
                    tile.style.top = targetTop + 'px';
                }
            }

            for (const s of swaps) {
                const tile = tileElements[s.normalTile];
                tile.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
                tile.style.left = (s.toC * getCellTotal()) + 'px';
                tile.style.top = (s.toR * getCellTotal()) + 'px';
            }

            setTimeout(() => {
                // Reset des z-index élevés pour les sauts
                for (const t of targets) {
                    tileElements[t.tileIndex].style.zIndex = '';
                }
                updateAllPositions();
                isAnimating = false;
            }, 320);
        }

        // Events
        container.addEventListener('mousedown', startDrag);
        container.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        // Resize handler
        window.addEventListener('resize', () => {
            sizes = computeSizes();
            updateAllPositions();
        });
    </script>
</body>
</html>
