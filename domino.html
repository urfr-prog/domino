<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAM Grid 3x4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e14;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    grid-template-rows: repeat(4, 120px);
    gap: 4px;
  }
  .cell {
    background: #0a0e14;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .cell.sat {
    background: #131d28;
    border: 1.5px solid rgba(0, 220, 255, 0.35);
    box-shadow: 0 0 12px rgba(0, 220, 255, 0.08);
  }
  .cell.center {
    background: #131d28;
    border: 1.5px solid rgba(0, 220, 255, 0.5);
    box-shadow: 0 0 18px rgba(0, 220, 255, 0.12);
    cursor: pointer;
  }
  .cell.center:hover {
    box-shadow: 0 0 24px rgba(0, 220, 255, 0.25);
  }
  .cell svg {
    width: 50px;
    height: 50px;
    filter: drop-shadow(0 0 4px rgba(0, 220, 255, 0.5));
  }
  .cell.center svg {
    filter: drop-shadow(0 0 8px rgba(0, 220, 255, 0.7)) drop-shadow(0 0 16px rgba(0, 220, 255, 0.3));
  }
</style>
</head>
<body>

<div class="grid">
  <!-- Ligne 1 : vide / vague / vide -->
  <div class="cell"></div>
  <div class="cell sat" data-row="0" data-col="1">
    <svg viewBox="0 0 50 50" fill="none">
      <path d="M6 25 C12 12, 18 12, 25 25 C32 38, 38 38, 44 25" stroke="#00e0ff" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="cell"></div>

  <!-- Ligne 2 : C / chevron / arc -->
  <div class="cell sat" data-row="1" data-col="0">
    <svg viewBox="0 0 50 50" fill="none">
      <path d="M10 30 C10 16, 40 16, 40 30" stroke="#00e0ff" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="cell sat" data-row="1" data-col="1">
    <svg viewBox="0 0 50 50" fill="none">
      <path d="M12 34 L25 16 L38 34" stroke="#00e0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="cell sat" data-row="1" data-col="2">
    <svg viewBox="0 0 50 50" fill="none">
      <path d="M10 20 C10 34, 40 34, 40 20" stroke="#00e0ff" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Ligne 3 : vide / huit / vide -->
  <div class="cell"></div>
  <div class="cell sat" data-row="2" data-col="1">
    <svg viewBox="0 0 50 50" fill="none">
      <circle cx="16" cy="25" r="8" stroke="#00e0ff" stroke-width="2.5"/>
      <circle cx="34" cy="25" r="8" stroke="#00e0ff" stroke-width="2.5"/>
    </svg>
  </div>
  <div class="cell"></div>

  <!-- Ligne 4 : vide / chevron / vide -->
  <div class="cell"></div>
  <div class="cell sat" data-row="3" data-col="1">
    <svg viewBox="0 0 50 50" fill="none">
      <path d="M12 34 L25 16 L38 34" stroke="#00e0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="cell"></div>
</div>

<script>
  const angles = {
    '0,1': 0,
    '1,0': 0, '1,1': 0, '1,2': 0,
    '2,1': 0,
    '3,1': 0
  };

  let busy = false;
  const cells = document.querySelectorAll('.cell.sat');

  cells.forEach(cell => {
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', () => {
      if (busy) return;
      busy = true;
      const row = parseInt(cell.dataset.row);
      const col = parseInt(cell.dataset.col);
      propagate(row, col, +1, new Set(), 0, row, col);
      setTimeout(() => { busy = false; }, 6 * 120 + 1000);
    });
  });

  // Direction de poussée depuis le parent vers l'enfant
  function getDir(fromRow, fromCol, toRow, toCol) {
    if (toRow < fromRow) return [0, -4];  // poussée vers le haut
    if (toRow > fromRow) return [0,  4];  // poussée vers le bas
    if (toCol < fromCol) return [-4, 0];  // poussée vers la gauche
    if (toCol > fromCol) return [ 4, 0];  // poussée vers la droite
    return [0, 0];
  }

  function propagate(row, col, sens, visited, depth, fromRow, fromCol) {
    const key = `${row},${col}`;
    if (visited.has(key)) return;
    if (!(key in angles)) return;
    visited.add(key);

    const delay = depth * 120;
    angles[key] += sens * 90;
    const el = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    const [tx, ty] = getDir(fromRow, fromCol, row, col);

    setTimeout(() => {
      // Phase 1 : compression rapide
      el.style.transition = 'transform 0.15s ease-in';
      el.style.transform = `rotate(${angles[key] - sens * 90}deg) translate(${tx}px, ${ty}px) scale(0.78)`;

      setTimeout(() => {
        // Phase 2 : rotation + regonflement simultanés — mécanique naturelle
        el.style.transition = 'transform 0.85s cubic-bezier(0.34, 1.3, 0.64, 1)';
        el.style.transform = `rotate(${angles[key]}deg) translate(0, 0) scale(1)`;
      }, 150);
    }, delay);

    [[row-1,col],[row+1,col],[row,col-1],[row,col+1]].forEach(([r,c]) => propagate(r, c, -sens, visited, depth + 1, row, col));
  }
</script>

</body>
</html>
