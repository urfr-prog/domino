<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KANNA - Silver Gold Cosmic v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; touch-action: none; }

        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .grid-wrapper {
            position: relative;
            width: 890px;
            height: 440px;
            overflow: hidden;
        }

        .grid-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .square {
            width: 80px; height: 80px;
            background-color: #12131a;
            border: 1px solid rgba(180, 180, 190, 0.35);
            border-radius: 14px;
            position: absolute;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .square:hover { border-color: rgba(180, 180, 190, 0.55); }
        .square svg { width: 100%; height: 100%; pointer-events: none; }

        svg .separator { stroke: rgba(180, 180, 190, 0.35); stroke-width: 1; }
        svg line.icon, svg path.icon, svg circle.icon, svg rect.icon, svg polyline.icon {
            stroke: rgba(220, 220, 230, 0.8); stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round; fill: none;
        }
        svg circle.point { fill: rgba(220, 220, 230, 0.8); stroke: none; }

        /* ========== SILVER ========== */
        .square.silver {
            border-color: rgba(126, 200, 227, 0.7);
            box-shadow: 0 0 15px rgba(126, 200, 227, 0.25), inset 0 0 20px rgba(126, 200, 227, 0.05);
        }
        .square.silver svg line.icon, .square.silver svg path.icon,
        .square.silver svg circle.icon, .square.silver svg rect.icon {
            stroke: #7ec8e3; filter: drop-shadow(0 0 3px rgba(126, 200, 227, 0.5));
        }
        .square.silver svg circle.point { fill: #7ec8e3; filter: drop-shadow(0 0 3px rgba(126, 200, 227, 0.5)); }
        .square.silver svg .separator { stroke: rgba(126, 200, 227, 0.4); }

        /* ========== GOLD ========== */
        .square.gold {
            border-color: rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .square.gold svg line.icon, .square.gold svg path.icon,
        .square.gold svg circle.icon, .square.gold svg rect.icon {
            stroke: #ffd700; filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        .square.gold svg circle.point { fill: #ffd700; filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6)); }
        .square.gold svg .separator { stroke: rgba(255, 215, 0, 0.4); }

        /* ========== COSMIC ========== */
        @property --cosmic-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

        .square.cosmic {
            border: 2px solid transparent;
            background:
                linear-gradient(#12131a, #12131a) padding-box,
                conic-gradient(from var(--cosmic-angle, 0deg), #ff006e, #8338ec, #06b6d4, #34d399, #ffd700, #ff006e) border-box;
            box-shadow:
                0 0 40px rgba(131, 56, 236, 0.6),
                0 0 60px rgba(255, 0, 110, 0.3),
                0 0 80px rgba(6, 182, 212, 0.3),
                inset 0 0 40px rgba(131, 56, 236, 0.15);
            animation: cosmicRotate 4s linear infinite, cosmicPulse 2s ease-in-out infinite;
        }
        .square.cosmic svg line.icon, .square.cosmic svg path.icon,
        .square.cosmic svg circle.icon, .square.cosmic svg rect.icon {
            stroke: #c4b5fd;
            filter: drop-shadow(0 0 8px rgba(131, 56, 236, 0.9)) drop-shadow(0 0 12px rgba(255, 0, 110, 0.6));
            animation: cosmicIconShift 3s ease-in-out infinite;
        }
        .square.cosmic svg circle.point {
            fill: #c4b5fd;
            filter: drop-shadow(0 0 8px rgba(131, 56, 236, 0.9));
            animation: cosmicPointPulse 1.5s ease-in-out infinite;
        }
        .square.cosmic svg .separator { stroke: rgba(196, 181, 253, 0.7); }

        @keyframes cosmicRotate { to { --cosmic-angle: 360deg; } }
        @keyframes cosmicPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(131, 56, 236, 0.6), 0 0 60px rgba(255, 0, 110, 0.3), 0 0 80px rgba(6, 182, 212, 0.3), inset 0 0 40px rgba(131, 56, 236, 0.15); }
            50% { box-shadow: 0 0 55px rgba(131, 56, 236, 0.8), 0 0 80px rgba(255, 0, 110, 0.5), 0 0 100px rgba(6, 182, 212, 0.4), inset 0 0 50px rgba(131, 56, 236, 0.2); }
        }
        @keyframes cosmicIconShift { 0%, 100% { stroke: #c4b5fd; } 33% { stroke: #22d3ee; } 66% { stroke: #f472b6; } }
        @keyframes cosmicPointPulse { 0%, 100% { fill: #c4b5fd; } 50% { fill: #f472b6; } }

        /* ========== INFO ========== */
        .move-counter {
            color: rgba(180, 180, 190, 0.5);
            font-size: 13px;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            display: flex;
            gap: 20px;
        }
        .move-counter .silver-label { color: #7ec8e3; }
        .move-counter .gold-label { color: #ffd700; }
        .move-counter .cosmic-label { color: #c4b5fd; }
    </style>
</head>
<body>

    <div class="move-counter">

        <span class="silver-label">● 7 Silver</span>
        <span class="gold-label">● 6 Gold</span>
        <span class="cosmic-label">● 5 Cosmic</span>
    </div>

        <div class="grid-container" id="gridContainer"></div>

        ];

        // ========== FAMILLES ==========
        // Tirer aléatoirement 7 silver, 6 gold, 5 cosmic (sans doublon)
        const allIndices = Array.from({length: 50}, (_, i) => i);
        for (let i = allIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
        }

        const families = {}; // tileIndex -> 'silver' | 'gold' | 'cosmic'
        const silverSet = new Set(allIndices.slice(0, 7));
        const goldSet = new Set(allIndices.slice(7, 13));
        const cosmicSet = new Set(allIndices.slice(13, 18));

        silverSet.forEach(i => families[i] = 'silver');
        goldSet.forEach(i => families[i] = 'gold');
        cosmicSet.forEach(i => families[i] = 'cosmic');

        // ========== GRILLE ==========
        let grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = r * COLS + c;
            }
        }

        const container = document.getElementById('gridContainer');
        let tileElements = [];

        for (let i = 0; i < 50; i++) {
            const tile = document.createElement('div');
            tile.className = 'square';
            if (families[i]) tile.classList.add(families[i]);
            tile.innerHTML = tilesData[i];
            tile.dataset.index = i;
            container.appendChild(tile);
            tileElements.push(tile);
        }

        function updateAllPositions() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const ti = grid[r][c];
                    const tile = tileElements[ti];
                    tile.style.transition = 'none';
                    tile.style.left = (c * CELL_TOTAL) + 'px';
                    tile.style.top = (r * CELL_TOTAL) + 'px';
                }
            }
        }
        updateAllPositions();

        // ========== DRAG ==========
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let dragAxis = null;
        let dragFamily = null;
        let moveCount = 0;
        let isAnimating = false;

        function findPos(tileIndex) {
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++)
                    if (grid[r][c] === tileIndex) return { r, c };
            return null;
        }

        function getFamilySet(family) {
            if (family === 'silver') return silverSet;
            if (family === 'gold') return goldSet;
            if (family === 'cosmic') return cosmicSet;
            return null;
        }

        function startDrag(e) {
            if (isAnimating) return;
            const tile = e.target.closest('.square');
            if (!tile) return;

            const ti = parseInt(tile.dataset.index);
            const family = families[ti];
            if (!family) return; // seules les tuiles colorées sont draggables

            e.preventDefault();
            isDragging = true;
            dragAxis = null;
            dragFamily = family;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
        }

        function moveDrag(e) {
            if (!isDragging || dragAxis !== null) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;

            const threshold = 20;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    dragAxis = dx > 0 ? 'right' : 'left';
                } else {
                    dragAxis = dy > 0 ? 'down' : 'up';
                }
                executeGroupMove(dragFamily, dragAxis);
            }
        }

        function endDrag() {
            isDragging = false;
            dragAxis = null;
            dragFamily = null;
        }

        function executeGroupMove(family, direction) {
            isAnimating = true;

            const deltas = {
                'up':    { dr: -1, dc: 0 },
                'down':  { dr: 1,  dc: 0 },
                'left':  { dr: 0,  dc: -1 },
                'right': { dr: 0,  dc: 1 }
            };
            const { dr, dc } = deltas[direction];
            const familySet = getFamilySet(family);

            // Snapshot de la grille actuelle
            const oldGrid = grid.map(row => [...row]);

            // Positions actuelles des membres
            const targets = [];
            for (const ti of familySet) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (oldGrid[r][c] === ti) {
                            targets.push({
                                tileIndex: ti,
                                fromR: r, fromC: c,
                                toR: ((r + dr) % ROWS + ROWS) % ROWS,
                                toC: ((c + dc) % COLS + COLS) % COLS
                            });
                        }
                    }
                }
            }

            // Set des cases cibles de la famille
            const targetKeys = new Set(targets.map(t => t.toR + ',' + t.toC));

            // Non-famille qui se trouvent sur une case cible : ils doivent bouger
            // Chaque non-famille va à la source DU MEMBRE QUI ARRIVE sur sa case
            const swaps = [];
            for (const t of targets) {
                const occupant = oldGrid[t.toR][t.toC];
                if (!familySet.has(occupant)) {
                    // Ce non-famille est poussé par ce membre précis
                    // Il va à la source de CE membre
                    swaps.push({ normalTile: occupant, toR: t.fromR, toC: t.fromC });
                }
            }

            // Mais attention : si la source de ce membre est AUSSI une case cible
            // d'un autre membre, alors il y a conflit.
            // Dans ce cas, il faut chaîner : le non-famille va à la source du membre
            // dont la cible est cette source, etc.
            // 
            // Simplifions : on sait que le nombre de cases libérées (sources non-cibles)
            // = le nombre de non-famille déplacés.
            // On construit la chaîne : pour chaque non-famille, on suit la chaîne
            // de sources jusqu'à trouver une source qui n'est pas une cible.

            // Map : cible -> source pour les membres
            const targetToSource = {};
            for (const t of targets) {
                targetToSource[t.toR + ',' + t.toC] = { r: t.fromR, c: t.fromC };
            }

            // Pour chaque swap, suivre la chaîne
            for (const s of swaps) {
                let destR = s.toR;
                let destC = s.toC;
                let key = destR + ',' + destC;
                // Tant que la destination est aussi une case cible d'un membre,
                // on suit vers la source de ce membre
                while (targetKeys.has(key)) {
                    const src = targetToSource[key];
                    destR = src.r;
                    destC = src.c;
                    key = destR + ',' + destC;
                }
                s.toR = destR;
                s.toC = destC;
            }

            // Construire la nouvelle grille
            const newGrid = oldGrid.map(row => [...row]);

            // Effacer toutes les positions sources des membres
            for (const t of targets) {
                newGrid[t.fromR][t.fromC] = -99;
            }

            // Placer les membres à leurs cibles
            for (const t of targets) {
                newGrid[t.toR][t.toC] = t.tileIndex;
            }

            // Placer les non-famille à leurs destinations chaînées
            for (const s of swaps) {
                newGrid[s.toR][s.toC] = s.normalTile;
            }

            // Vérification
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (newGrid[r][c] === -99 || newGrid[r][c] < 0) {
                        console.error('BUG: case non remplie à', r, c);
                        isAnimating = false;
                        return;
                    }
                }
            }

            grid = newGrid;
            animateMove(targets, swaps, dr, dc);

            moveCount++;
            document.getElementById('moveCount').textContent = moveCount;
        }

        function animateMove(targets, swaps, dr, dc) {
            const pxX = dc * CELL_TOTAL;
            const pxY = dr * CELL_TOTAL;

            for (const t of targets) {
                const tile = tileElements[t.tileIndex];
                const targetLeft = t.toC * CELL_TOTAL;
                const targetTop = t.toR * CELL_TOTAL;
                const isWrap = Math.abs(t.toC - t.fromC) > 1 || Math.abs(t.toR - t.fromR) > 1;

                if (isWrap) {
                    const exitLeft = t.fromC * CELL_TOTAL + pxX;
                    const exitTop = t.fromR * CELL_TOTAL + pxY;
                    tile.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
                    tile.style.left = exitLeft + 'px';
                    tile.style.top = exitTop + 'px';
                    setTimeout(() => {
                        tile.style.transition = 'none';
                        tile.style.left = targetLeft + 'px';
                        tile.style.top = targetTop + 'px';
                    }, 160);
                } else {
                    tile.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
                    tile.style.left = targetLeft + 'px';
                    tile.style.top = targetTop + 'px';
                }
            }

            for (const s of swaps) {
                const tile = tileElements[s.normalTile];
                tile.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
                tile.style.left = (s.toC * CELL_TOTAL) + 'px';
                tile.style.top = (s.toR * CELL_TOTAL) + 'px';
            }

            setTimeout(() => {
                updateAllPositions();
                isAnimating = false;
            }, 200);
        }

        // Events
        container.addEventListener('mousedown', startDrag);
        container.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    </script>
</body>
</html>
